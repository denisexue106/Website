<rect x="240" y="320" width="230" height="48" rx="5" fill="#fff" stroke="#e8e3d8"/><rect x="252" y="334" width="100" height="6" rx="3" fill="#ddd6c8"/><rect x="252" y="348" width="140" height="5" rx="2.5" fill="#e7e1d5"/>
<rect x="240" y="380" width="88" height="26" rx="5" fill="#8a6d3f"/>
</g>
