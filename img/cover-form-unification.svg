<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Form builder interface: a four-step progress indicator, a field palette, a form canvas and a live preview panel">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f4f1ea"/><stop offset="1" stop-color="#ebe6db"/>
</linearGradient>
<filter id="sh2" x="-8%" y="-8%" width="116%" height="124%">
<feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#4a3f2a" flood-opacity="0.10"/>
</filter>
</defs>
<rect width="800" height="500" fill="url(#bg2)"/>
<g filter="url(#sh2)"><rect x="70" y="56" width="660" height="392" rx="10" fill="#ffffff"/></g>
<path d="M70 66a10 10 0 0 1 10-10h640a10 10 0 0 1 10 10v22H70z" fill="#faf9f6"/>
