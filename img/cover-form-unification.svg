<circle cx="420" cy="114" r="9" fill="#fff" stroke="#d8d1c3"/><text x="420" y="117.5" text-anchor="middle" fill="#a8a094" font-size="8.5">3</text>
<text x="437" y="117" fill="#a8a094">Settings</text>
