<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Confirmation dialog contrasting disable and disconnect, each listing its consequences before the user commits">
<defs>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f6"/><stop offset="1" stop-color="#e3e8f0"/></linearGradient>
<filter id="s2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#25314a" flood-opacity="0.14"/></filter>
</defs>
<rect width="800" height="500" fill="url(#g2)"/>
<!-- dimmed page behind -->
<rect x="70" y="56" width="660" height="392" rx="10" fill="#fff" opacity="0.45"/>
<g opacity="0.3">
<rect x="96" y="96" width="140" height="6" rx="3" fill="#c8cdd6"/>
<rect x="96" y="126" width="608" height="1" fill="#dfe3ea"/>
<rect x="96" y="148" width="200" height="6" rx="3" fill="#dfe3ea"/>
<rect x="96" y="176" width="608" height="1" fill="#eaedf2"/>
</g>
<g filter="url(#s2)"><rect x="176" y="118" width="448" height="272" rx="12" fill="#fff"/></g>
<g font-family="Inter,sans-serif">
<text x="208" y="158" font-size="15" font-weight="600" fill="#1c2534">Before you continue</text>
<text x="208" y="180" font-size="10.5" fill="#6b7280">These two actions are not the same. Here is what each one does.</text>
<!-- disable -->
<rect x="208" y="198" width="180" height="128" rx="8" fill="#fafbfc" stroke="#e4e8ee"/>
<text x="226" y="222" font-size="11" font-weight="600" fill="#1c2534">Disable</text>
<g font-size="9.5" fill="#6b7280">
<circle cx="230" cy="244" r="2.4" fill="#4a9a6b"/><text x="240" y="247">Listing stays connected</text>
<circle cx="230" cy="266" r="2.4" fill="#4a9a6b"/><text x="240" y="269">Data is preserved</text>
<circle cx="230" cy="288" r="2.4" fill="#4a9a6b"/><text x="240" y="291">Re-enable any time</text>
</g>
<rect x="226" y="300" width="112" height="1" fill="#eef1f5"/>
<text x="226" y="316" font-size="9" fill="#9aa2ae">Reversible</text>
<!-- disconnect -->
<rect x="404" y="198" width="180" height="128" rx="8" fill="#fdfafa" stroke="#eedfdd"/>
<text x="422" y="222" font-size="11" font-weight="600" fill="#1c2534">Disconnect</text>
<g font-size="9.5" fill="#6b7280">
<circle cx="426" cy="244" r="2.4" fill="#b8574e"/><text x="436" y="247">Listing is removed</text>
<circle cx="426" cy="266" r="2.4" fill="#b8574e"/><text x="436" y="269">Reviews stop syncing</text>
<circle cx="426" cy="288" r="2.4" fill="#b8574e"/><text x="436" y="291">Re-verification needed</text>
</g>
<rect x="422" y="300" width="112" height="1" fill="#f5eae9"/>
<text x="422" y="316" font-size="9" fill="#b8574e">Cannot be undone</text>
<!-- actions -->
<rect x="208" y="346" width="76" height="28" rx="6" fill="#fff" stroke="#d5dae2"/>
<text x="246" y="364" text-anchor="middle" font-size="10" fill="#44536b">Cancel</text>
<rect x="404" y="346" width="84" height="28" rx="6" fill="#e9eef4"/>
<text x="446" y="364" text-anchor="middle" font-size="10" font-weight="500" fill="#44536b">Disable</text>
<rect x="500" y="346" width="84" height="28" rx="6" fill="#b8574e"/>
<text x="542" y="364" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Disconnect</text>
</g>
</svg>
