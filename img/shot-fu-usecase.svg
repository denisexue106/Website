<filter id="sf" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#4a3f2a" flood-opacity="0.10"/></filter>
</defs>
<rect width="800" height="500" fill="url(#gf)"/>
