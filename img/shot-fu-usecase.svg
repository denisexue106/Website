<rect x="132" y="294" width="248" height="94" rx="9" fill="#fbfaf7" stroke="#eeeae1"/>
<rect x="152" y="314" width="26" height="26" rx="6" fill="#f2efe8"/>
<rect x="158" y="321" width="14" height="10" rx="2" stroke="#b5aa97" stroke-width="1.5" fill="none"/>
<text x="194" y="324" font-size="12" font-weight="600" fill="#2f2a22">Sit on a landing page</text>
