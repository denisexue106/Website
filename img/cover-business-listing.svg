<text x="560" y="208" font-family="Inter,sans-serif" font-size="9" letter-spacing="0.08em" fill="#9aa2ae">STATUS</text>
<rect x="224" y="218" width="490" height="1" fill="#eef1f5"/>
<g font-family="Inter,sans-serif" font-size="10">
<!-- row 1 -->
<rect x="240" y="232" width="18" height="18" rx="5" fill="#e8edf4"/>
<rect x="268" y="238" width="96" height="6" rx="3" fill="#cfd5de"/>
<circle cx="566" cy="241" r="3.5" fill="#4a9a6b"/><text x="576" y="245" fill="#4a7a5f">Connected</text>
<rect x="224" y="262" width="490" height="1" fill="#f2f4f7"/>
<!-- row 2 -->
<rect x="240" y="276" width="18" height="18" rx="5" fill="#e8edf4"/>
<rect x="268" y="282" width="74" height="6" rx="3" fill="#cfd5de"/>
