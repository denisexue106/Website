<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Listings management interface: a profile health score above a list of directory platforms with connection statuses">
<defs>
<linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#eef1f6"/><stop offset="1" stop-color="#e3e8f0"/>
</linearGradient>
<filter id="sh1" x="-8%" y="-8%" width="116%" height="124%">
<feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#25314a" flood-opacity="0.10"/>
</filter>
</defs>
<rect width="800" height="500" fill="url(#bg1)"/>
<g filter="url(#sh1)">
<rect x="70" y="56" width="660" height="392" rx="10" fill="#ffffff"/>
</g>
