<rect x="224" y="306" width="490" height="1" fill="#f2f4f7"/>
<!-- row 3 processing -->
<rect x="240" y="320" width="18" height="18" rx="5" fill="#e8edf4"/>
<rect x="268" y="326" width="110" height="6" rx="3" fill="#cfd5de"/>
<circle cx="566" cy="329" r="3.5" fill="#c99a3e"/><text x="576" y="333" fill="#8a6a2e">Processing</text>
<rect x="224" y="350" width="490" height="1" fill="#f2f4f7"/>
<!-- row 4 issue -->
<rect x="240" y="364" width="18" height="18" rx="5" fill="#f6ecec"/>
<rect x="268" y="370" width="84" height="6" rx="3" fill="#cfd5de"/>
<circle cx="566" cy="373" r="3.5" fill="#b8574e"/><text x="576" y="377" fill="#9a4a43">Issue found</text>
<rect x="662" y="364" width="52" height="18" rx="9" fill="#fff" stroke="#e0c4c1"/>
<text x="688" y="376" text-anchor="middle" font-size="8.5" fill="#9a4a43">Fix</text>
<rect x="224" y="394" width="490" height="1" fill="#f2f4f7"/>
<!-- row 5 -->
<rect x="240" y="408" width="18" height="18" rx="5" fill="#e8edf4"/>
<rect x="268" y="414" width="92" height="6" rx="3" fill="#cfd5de"/>
<circle cx="566" cy="417" r="3.5" fill="#4a9a6b"/><text x="576" y="421" fill="#4a7a5f">Connected</text>
