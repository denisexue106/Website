<path d="M70 66a10 10 0 0 1 10-10h640a10 10 0 0 1 10 10v22H70z" fill="#f7f8fa"/>
<circle cx="90" cy="77" r="3.5" fill="#d9dde4"/><circle cx="103" cy="77" r="3.5" fill="#d9dde4"/><circle cx="116" cy="77" r="3.5" fill="#d9dde4"/>
<rect x="70" y="88" width="660" height="1" fill="#eaedf2"/>
<!-- sidebar -->
<rect x="70" y="89" width="132" height="359" fill="#fbfcfd"/>
<rect x="201" y="89" width="1" height="359" fill="#eaedf2"/>
<rect x="88" y="110" width="58" height="7" rx="3.5" fill="#c8cdd6"/>
<g fill="#dfe3ea">
<rect x="88" y="140" width="86" height="6" rx="3"/><rect x="88" y="164" width="70" height="6" rx="3"/>
<rect x="88" y="188" width="92" height="6" rx="3"/>
</g>
<rect x="78" y="206" width="114" height="26" rx="6" fill="#eaeff7"/>
<rect x="88" y="216" width="80" height="6" rx="3" fill="#3d6b99"/>
<g fill="#dfe3ea">
<rect x="88" y="246" width="76" height="6" rx="3"/><rect x="88" y="270" width="88" height="6" rx="3"/>
<rect x="88" y="294" width="64" height="6" rx="3"/>
</g>
<!-- health score card -->
<rect x="224" y="108" width="212" height="72" rx="8" fill="#f7f9fc" stroke="#e7ebf1"/>
<text x="240" y="132" font-family="Inter,sans-serif" font-size="10" fill="#6b7280">Profile health</text>
<text x="240" y="157" font-family="Inter,sans-serif" font-size="22" font-weight="600" fill="#1c2534">78%</text>
<rect x="240" y="166" width="180" height="5" rx="2.5" fill="#e4e8ee"/>
<rect x="240" y="166" width="140" height="5" rx="2.5" fill="#3d6b99"/>
<!-- AI suggestion -->
<rect x="448" y="108" width="266" height="72" rx="8" fill="#f4f7fb" stroke="#e2e9f2"/>
<circle cx="468" cy="130" r="7" fill="#3d6b99" opacity="0.15"/>
<path d="M468 126l1.4 3.1 3.1 1.4-3.1 1.4-1.4 3.1-1.4-3.1-3.1-1.4 3.1-1.4z" fill="#3d6b99"/>
<text x="484" y="134" font-family="Inter,sans-serif" font-size="10" font-weight="500" fill="#1c2534">Suggested fix</text>
<rect x="468" y="146" width="210" height="5" rx="2.5" fill="#d8e0ea"/>
<rect x="468" y="158" width="146" height="5" rx="2.5" fill="#e4eaf1"/>
