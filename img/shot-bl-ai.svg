<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="AI assistant panel presenting a drafted review response with approve, edit and decline actions rather than an empty text box">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f6"/><stop offset="1" stop-color="#e3e8f0"/></linearGradient>
<filter id="s" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#25314a" flood-opacity="0.10"/></filter>
</defs>
<rect width="800" height="500" fill="url(#g)"/>
<g filter="url(#s)"><rect x="96" y="60" width="608" height="384" rx="10" fill="#fff"/></g>
<path d="M96 70a10 10 0 0 1 10-10h588a10 10 0 0 1 10 10v20H96z" fill="#f7f8fa"/>
<circle cx="116" cy="80" r="3.5" fill="#d9dde4"/><circle cx="129" cy="80" r="3.5" fill="#d9dde4"/><circle cx="142" cy="80" r="3.5" fill="#d9dde4"/>
<rect x="96" y="90" width="608" height="1" fill="#eaedf2"/>
<g font-family="Inter,sans-serif">
<!-- incoming review -->
<text x="124" y="122" font-size="9" letter-spacing="0.08em" fill="#9aa2ae">NEW REVIEW</text>
<rect x="124" y="134" width="552" height="76" rx="8" fill="#fafbfc" stroke="#eaedf2"/>
<circle cx="146" cy="158" r="10" fill="#e3e8f0"/>
<rect x="164" y="152" width="72" height="6" rx="3" fill="#cfd5de"/>
<g fill="#e2b13c"><circle cx="168" cy="168" r="2.6"/><circle cx="178" cy="168" r="2.6"/><circle cx="188" cy="168" r="2.6"/></g>
<circle cx="198" cy="168" r="2.6" fill="#dfe3ea"/><circle cx="208" cy="168" r="2.6" fill="#dfe3ea"/>
<rect x="146" y="184" width="480" height="5" rx="2.5" fill="#dfe3ea"/>
<rect x="146" y="195" width="360" height="5" rx="2.5" fill="#e8ebf0"/>
<!-- AI drafted reply -->
<rect x="124" y="228" width="552" height="132" rx="8" fill="#f4f7fb" stroke="#d9e3ef"/>
<circle cx="146" cy="252" r="8" fill="#3d6b99" opacity="0.16"/>
<path d="M146 248l1.5 3.3 3.3 1.5-3.3 1.5-1.5 3.3-1.5-3.3-3.3-1.5 3.3-1.5z" fill="#3d6b99"/>
<text x="162" y="256" font-size="10.5" font-weight="600" fill="#1c2534">Suggested response</text>
<rect x="286" y="245" width="84" height="16" rx="8" fill="#e5ecf5"/>
<text x="328" y="256" text-anchor="middle" font-size="8" font-weight="600" fill="#3d6b99">DRAFTED FOR YOU</text>
<rect x="146" y="274" width="508" height="5.5" rx="2.75" fill="#c8d6e6"/>
<rect x="146" y="288" width="480" height="5.5" rx="2.75" fill="#cfdae8"/>
<rect x="146" y="302" width="392" height="5.5" rx="2.75" fill="#d7e0ec"/>
<!-- actions: a decision, not a blank box -->
<rect x="146" y="324" width="96" height="26" rx="6" fill="#3d6b99"/>
<text x="194" y="341" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Approve</text>
<rect x="252" y="324" width="72" height="26" rx="6" fill="#fff" stroke="#c8d3e0"/>
<text x="288" y="341" text-anchor="middle" font-size="10" fill="#44536b">Edit</text>
<rect x="334" y="324" width="76" height="26" rx="6" fill="#fff" stroke="#e0d3d1"/>
<text x="372" y="341" text-anchor="middle" font-size="10" fill="#9a5a52">Decline</text>
<text x="428" y="341" font-size="9.5" fill="#9aa2ae">A five-second decision</text>
<!-- footnote -->
<rect x="124" y="380" width="552" height="1" fill="#eef1f5"/>
<text x="124" y="404" font-size="9.5" fill="#8a929e">Not a blank text box — the model proposes, the owner decides.</text>
</g>
</svg>
