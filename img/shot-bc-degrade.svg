<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Delete logo confirmation showing where the logo is used and that each surface falls back to a placeholder rather than another brand">
<defs>
<linearGradient id="gb2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1ec"/><stop offset="1" stop-color="#e3e8e0"/></linearGradient>
<filter id="sb2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2c3a2c" flood-opacity="0.14"/></filter>
</defs>
<rect width="800" height="500" fill="url(#gb2)"/>
<rect x="70" y="56" width="660" height="392" rx="10" fill="#fff" opacity="0.45"/>
<g opacity="0.28">
<rect x="96" y="96" width="120" height="6" rx="3" fill="#c3ccbe"/>
<rect x="96" y="124" width="112" height="72" rx="7" fill="#dde3d9"/><rect x="220" y="124" width="112" height="72" rx="7" fill="#e6eae2"/>
</g>
<g filter="url(#sb2)"><rect x="168" y="104" width="464" height="300" rx="12" fill="#fff"/></g>
<g font-family="Inter,sans-serif">
<text x="200" y="146" font-size="15" font-weight="600" fill="#28321f">Delete this logo?</text>
<text x="200" y="168" font-size="10.5" fill="#76806f">It is referenced in 3 places. Nothing breaks. Each falls back.</text>
<!-- usage list -->
<rect x="200" y="186" width="400" height="120" rx="8" fill="#fafbf9" stroke="#e9ede7"/>
<g font-size="10">
<rect x="220" y="202" width="18" height="18" rx="5" fill="#e6ece3"/>
<text x="248" y="215" fill="#3c4a38">4 email templates</text>
<text x="580" y="215" text-anchor="end" font-size="9" fill="#8d9686">→ placeholder</text>
<rect x="220" y="204" width="360" height="0" fill="none"/>
<rect x="212" y="230" width="376" height="1" fill="#eef1ec"/>
<rect x="220" y="240" width="18" height="18" rx="5" fill="#e6ece3"/>
<text x="248" y="253" fill="#3c4a38">2 landing pages</text>
<text x="580" y="253" text-anchor="end" font-size="9" fill="#8d9686">→ placeholder</text>
<rect x="212" y="268" width="376" height="1" fill="#eef1ec"/>
<rect x="220" y="278" width="18" height="18" rx="5" fill="#e6ece3"/>
<text x="248" y="291" fill="#3c4a38">1 shared campaign</text>
<text x="580" y="291" text-anchor="end" font-size="9" fill="#8d9686">→ destination brand</text>
</g>
<!-- rule callout -->
<rect x="200" y="320" width="400" height="34" rx="7" fill="#f4f7f2" stroke="#dde7d9"/>
<circle cx="220" cy="337" r="7" fill="#5f7a5f" opacity="0.2"/>
<path d="M220 333v5M220 341v.5" stroke="#5f7a5f" stroke-width="1.6" stroke-linecap="round"/>
<text x="236" y="341" font-size="9.5" fill="#4a5a46">A missing asset degrades to a placeholder, never to somebody else’s brand.</text>
<!-- actions -->
<rect x="200" y="366" width="76" height="26" rx="6" fill="#fff" stroke="#d6ded2"/>
<text x="238" y="383" text-anchor="middle" font-size="10" fill="#4a5a46">Cancel</text>
<rect x="524" y="366" width="76" height="26" rx="6" fill="#9a5a52"/>
<text x="562" y="383" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Delete</text>
</g>
</svg>
