<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Four evaluation epics, traditional citations, AI citations, reviews and insights, arranged around one persona lens: a roofer running her own business" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="800" height="500" fill="#f3f3f0"/>
<rect x="300" y="190" width="200" height="120" rx="10" fill="#0f0f0f"/>
<text x="400" y="216" font-size="8.5" fill="#c9c9c3" text-anchor="middle" letter-spacing="1.6">ONE LENS</text>
<text x="400" y="240" font-size="12.5" fill="#fafaf8" text-anchor="middle" font-weight="600">A roofer running</text>
<text x="400" y="257" font-size="12.5" fill="#fafaf8" text-anchor="middle" font-weight="600">her own business</text>
<text x="400" y="282" font-size="9.5" fill="#c9c9c3" text-anchor="middle">Every option scored against what</text>
<text x="400" y="296" font-size="9.5" fill="#c9c9c3" text-anchor="middle">helps her, not what a platform can do</text>
<rect x="48" y="56" width="200" height="114" rx="8" fill="#fafaf8" stroke="#e0e0da" stroke-width="1"/>
<text x="64" y="82" font-size="11.5" fill="#0f0f0f" text-anchor="start" font-weight="600">Citations · traditional</text>
<text x="64" y="104.0" font-size="10" fill="#6b6b6b" text-anchor="start">Show up with the right info when</text>
<text x="64" y="118.5" font-size="10" fill="#6b6b6b" text-anchor="start">someone searches “roofer near</text>
<text x="64" y="133.0" font-size="10" fill="#6b6b6b" text-anchor="start">me”, without her updating 50+</text>
<text x="64" y="147.5" font-size="10" fill="#6b6b6b" text-anchor="start">directories by hand.</text>
<rect x="552" y="56" width="200" height="114" rx="8" fill="#fafaf8" stroke="#e0e0da" stroke-width="1"/>
<text x="568" y="82" font-size="11.5" fill="#0f0f0f" text-anchor="start" font-weight="600">Citations · AI / GEO</text>
<text x="568" y="104.0" font-size="10" fill="#6b6b6b" text-anchor="start">Be in the answer when a</text>
<text x="568" y="118.5" font-size="10" fill="#6b6b6b" text-anchor="start">homeowner asks an assistant who</text>
<text x="568" y="133.0" font-size="10" fill="#6b6b6b" text-anchor="start">the best roofer is.</text>
<rect x="48" y="330" width="200" height="114" rx="8" fill="#fafaf8" stroke="#e0e0da" stroke-width="1"/>
<text x="64" y="356" font-size="11.5" fill="#0f0f0f" text-anchor="start" font-weight="600">Reviews</text>
<text x="64" y="378.0" font-size="10" fill="#6b6b6b" text-anchor="start">Replies go out without her</text>
<text x="64" y="392.5" font-size="10" fill="#6b6b6b" text-anchor="start">writing them. She is on a roof,</text>
<text x="64" y="407.0" font-size="10" fill="#6b6b6b" text-anchor="start">not on her phone.</text>
<rect x="552" y="330" width="200" height="114" rx="8" fill="#fafaf8" stroke="#e0e0da" stroke-width="1"/>
<text x="568" y="356" font-size="11.5" fill="#0f0f0f" text-anchor="start" font-weight="600">Insights</text>
<text x="568" y="378.0" font-size="10" fill="#6b6b6b" text-anchor="start">Tells her when she is falling</text>
<text x="568" y="392.5" font-size="10" fill="#6b6b6b" text-anchor="start">behind competitors, and what to</text>
<text x="568" y="407.0" font-size="10" fill="#6b6b6b" text-anchor="start">do about it.</text>
<line x1="248" y1="113" x2="300" y2="205" stroke="#cfcfc8" stroke-width="1"/>
<line x1="552" y1="113" x2="500" y2="205" stroke="#cfcfc8" stroke-width="1"/>
<line x1="248" y1="387" x2="300" y2="295" stroke="#cfcfc8" stroke-width="1"/>
<line x1="552" y1="387" x2="500" y2="295" stroke="#cfcfc8" stroke-width="1"/>
</svg>
